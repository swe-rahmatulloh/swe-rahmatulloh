<svg width="920" height="190" viewBox="0 0 920 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution snake 2025-2026</title>
  <desc id="desc">Dark contribution grid snake animation for 2025-2026</desc>
  <style>
    .text { fill: #8b949e; font: 600 13px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .year { fill: #c9d1d9; font: 700 15px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .dot0 { fill: #161b22; }
    .dot1 { fill: #0e4429; }
    .dot2 { fill: #006d32; }
    .dot3 { fill: #26a641; }
    .snake { fill: #9e0fae; }
    .head { fill: #39d353; }
  </style>

  <rect width="920" height="190" rx="8" fill="#0d1117"/>

  <text x="34" y="28" class="year">2025</text>
  <text x="840" y="28" class="year">2026</text>
  <text x="97" y="28" class="text">Jul</text>
  <text x="236" y="28" class="text">Sep</text>
  <text x="380" y="28" class="text">Nov</text>
  <text x="520" y="28" class="text">Jan</text>
  <text x="660" y="28" class="text">Mar</text>
  <text x="800" y="28" class="text">May</text>

  <defs>
    <pattern id="grid" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="11" height="11" rx="2" class="dot0"/>
    </pattern>
  </defs>

  <rect x="34" y="44" width="848" height="112" fill="url(#grid)"/>

  <g>
    <rect x="50" y="92" width="11" height="11" rx="2" class="dot2"/>
    <rect x="194" y="44" width="11" height="11" rx="2" class="dot3"/>
    <rect x="226" y="92" width="11" height="11" rx="2" class="dot2"/>
    <rect x="370" y="60" width="11" height="11" rx="2" class="dot1"/>
    <rect x="546" y="108" width="11" height="11" rx="2" class="dot2"/>
    <rect x="674" y="92" width="11" height="11" rx="2" class="dot1"/>
    <rect x="754" y="60" width="11" height="11" rx="2" class="dot2"/>
    <rect x="850" y="44" width="11" height="11" rx="2" class="dot3"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" dur="11s" repeatCount="indefinite"
      values="0 0; 145 0; 305 32; 465 64; 625 32; 785 0; 0 0"
      keyTimes="0; .16; .34; .52; .70; .88; 1"/>
    <rect x="34" y="124" width="11" height="11" rx="2" class="snake" opacity="0.45"/>
    <rect x="50" y="124" width="11" height="11" rx="2" class="snake" opacity="0.65"/>
    <rect x="66" y="124" width="11" height="11" rx="2" class="snake" opacity="0.85"/>
    <rect x="82" y="124" width="11" height="11" rx="2" class="snake"/>
    <rect x="98" y="124" width="11" height="11" rx="2" class="head"/>
  </g>

  <rect x="34" y="172" width="330" height="10" rx="2" fill="#0e4429"/>
</svg>
