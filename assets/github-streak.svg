<svg width="720" height="170" viewBox="0 0 720 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity summary</title>
  <desc id="desc">Simple GitHub activity summary card for swe-rahmatulloh</desc>
  <style>
    .label { fill: #c9d1d9; font: 600 16px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .muted { fill: #8b949e; font: 500 13px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .num { fill: #58a6ff; font: 700 30px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
    .date { fill: #39d353; font: 500 12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif; }
  </style>

  <rect width="720" height="170" rx="10" fill="#0d1117"/>

  <line x1="235" y1="35" x2="235" y2="135" stroke="#8b949e" stroke-width="1" opacity="0.7"/>
  <line x1="485" y1="35" x2="485" y2="135" stroke="#8b949e" stroke-width="1" opacity="0.7"/>

  <g text-anchor="middle">
    <text x="125" y="66" class="num">110</text>
    <text x="125" y="101" class="label">Total Contributions</text>
    <text x="125" y="128" class="muted">Mar 20, 2023 - Present</text>
  </g>

  <g text-anchor="middle">
    <circle cx="360" cy="72" r="42" stroke="#2f81f7" stroke-width="7" fill="none"/>
    <path d="M360 20c7 8 8 17 1 25 1-8-7-11-7-20-9 8-15 18-10 30 4 11 15 15 26 11 13-5 17-21 7-34 2 10-5 15-13 11 5-7 4-14-4-23z" fill="#58a6ff"/>
    <text x="360" y="82" class="num" fill="#c9d1d9">1</text>
    <text x="360" y="121" class="label">Current Streak</text>
    <text x="360" y="147" class="date">Jul 8</text>
  </g>

  <g text-anchor="middle">
    <text x="595" y="66" class="num">5</text>
    <text x="595" y="101" class="label">Longest Streak</text>
    <text x="595" y="128" class="muted">Sep 18, 2023 - Sep 22, 2023</text>
  </g>
</svg>
